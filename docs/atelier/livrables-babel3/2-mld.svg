<rect x="1370" y="80" width="360" height="190" fill="#fff8dc" stroke="#b8a04a" stroke-width="1.5" rx="4"/>
<text x="1382" y="106" font-size="13.5" fill="#333" font-weight="700">Choix de conception</text>
<text x="1382" y="127" font-size="13.5" fill="#333">Aucune page n&#x27;est stockée : seule l&#x27;adresse l&#x27;est.</text>
<text x="1382" y="148" font-size="13.5" fill="#333">La clé secrète n&#x27;est pas en base (configuration).</text>
<text x="1382" y="169" font-size="13.5" fill="#333">Une adresse n&#x27;existe en base que si elle est citée</text>
<text x="1382" y="190" font-size="13.5" fill="#333">(favori, signalement, masquage).</text>
<text x="1382" y="211" font-size="13.5" fill="#333">L&#x27;empreinte identifie les adresses de 3 000+ car.</text>
<text x="1382" y="232" font-size="13.5" fill="#333"># = identifiant   → = clé étrangère</text>
